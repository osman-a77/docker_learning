services:
  web:
    build: .
    expose:
      - "5000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  nginx:
    image: nginx:latest
    ports:
      - "5002:5002"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web


  redis: 
    image: redis:latest
    volumes:
    - redis-data:/data
volumes:
  redis-data:  
